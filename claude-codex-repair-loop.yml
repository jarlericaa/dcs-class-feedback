# Copy this file to .github/workflows/claude-codex-repair-loop.yml only after
# setting the repository secret/variables described in
# docs/AUTONOMOUS_CLAUDE_CODEX_LOOP.md.
#
# This template is intentionally not active while it lives under docs/.

name: Claude repair after Codex review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-codex-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    # Set CODEX_REVIEWER_LOGIN after observing the actual Codex reviewer login
    # on one test PR. Restrict write-capable automation to same-repository PRs.
    if: >-
      github.event.review.state == 'commented' &&
      github.event.review.user.login == vars.CODEX_REVIEWER_LOGIN &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_repair: ${{ steps.round.outputs.should_repair }}
      round: ${{ steps.round.outputs.round }}
    steps:
      - name: Enforce a finite repair loop
        id: round
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const rounds = comments.filter((comment) =>
              /<!-- claude-codex-round:\d+ -->/.test(comment.body || ''),
            ).length;
            const maxRounds = 3;
            core.setOutput('should_repair', rounds < maxRounds ? 'true' : 'false');
            core.setOutput('round', String(rounds + 1));

  repair:
    needs: guard
    if: needs.guard.outputs.should_repair == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ask Claude to repair the latest Codex review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Set CLAUDE_MODEL to the exact model identifier available to the
          # organization. Use the Opus 5 identifier if the account exposes it.
          claude_args: --max-turns 20 --model ${{ vars.CLAUDE_MODEL }}
          prompt: |
            You are repairing the current pull request after a Codex review.
            This is repair round ${{ needs.guard.outputs.round }}.

            Read AGENTS.md, CLAUDE.md, PROJECT_CONTEXT.md, docs/INDEX.md,
            docs/CURRENT_STATE.md, docs/SECURITY.md, and the owning product
            documents before editing. Inspect the complete latest Codex review
            and all inline review comments for this pull request.

            Work autonomously. Fix concrete actionable findings that are
            within the pull request scope, especially privacy, authorization,
            correctness, data integrity, accessibility, and failing-test
            findings. Do not blindly implement a false positive or expand the
            product into deferred features. If a finding would change a
            confirmed product rule or durable architecture, make the smallest
            safe correction and update the owning docs/ADR, or leave a clear
            PR comment explaining the genuine blocker.

            Run npm run lint, npm run typecheck, npm test, and npm run build.
            Run integration tests when PostgreSQL is available and report an
            environment block accurately when it is not. Inspect the final
            diff for student-data leaks and server-side authorization gaps.

            If code or tests changed, commit and push to the current PR branch
            using a proper Conventional Commit such as
            fix(authz): enforce section scope on Q&A reads. Do not use an
            add: prefix when feat: is clearer. Never add Co-authored-by
            trailers, Generated by Claude text, agent/bot signatures, or other
            co-authorship markers. Never merge, close, force-push, or deploy.
            If no concrete fix is justified, do not create a no-op commit.

      - name: Mark the round and request a deterministic Codex re-review
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              },
            );
            const latest = commits.at(-1);
            const changed = latest && latest.sha !== context.payload.pull_request.head.sha;
            const round = '${{ needs.guard.outputs.round }}';
            const body = changed
              ? [
                  '<!-- claude-codex-round:' + round + ' -->',
                  'Claude completed repair round ' + round + ' and pushed ' + latest.sha.slice(0, 7) + '. Requesting Codex to review the new commit.',
                  '@codex review',
                ].join('\n\n')
              : [
                  '<!-- claude-codex-round:' + round + ' -->',
                  'Claude completed repair round ' + round + ' without a new commit. No automatic re-review was requested.',
                ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
